name: Checks

on:
  pull_request:
  push:
    branches: [claude/project-thread-rg4eys]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx next typegen && npx tsc --noEmit
      - name: Build
        run: npm run build
